# CROA issue & PR label taxonomy
# Apply with a label-sync action (e.g. micnncim/action-label-sync or github-label-sync).
# Families: type / area / change-level / status / community.

# ── type: what kind of item ────────────────────────────────
- name: "type:challenge"
  color: "b60205"
  description: "Argument or scenario that the central claim may not hold"
- name: "type:clarification"
  color: "0e8a16"
  description: "Spec is unclear or under-specified; no requirement changes"
- name: "type:normative-conflict"
  color: "d93f0b"
  description: "Two parts of the spec disagree"
- name: "type:conformance-gap"
  color: "d93f0b"
  description: "Conformance criteria are incomplete or untestable as written"
- name: "type:threat-model-gap"
  color: "e99695"
  description: "A threat or failure mode not addressed by the threat model"
- name: "type:claims-risk"
  color: "fbca04"
  description: "Wording that over- or mis-states what CROA guarantees"
- name: "type:harness-bug"
  color: "5319e7"
  description: "Defect in the Minimal Reference Harness"
- name: "type:evidence"
  color: "1d76db"
  description: "Implementation, benchmark, pilot, or failure report"
- name: "type:question"
  color: "cccccc"
  description: "A question; consider Discussions first"

# ── area: where it lives ───────────────────────────────────
- name: "area:part-I"
  color: "c5def5"
  description: "Foundations"
- name: "area:part-II"
  color: "c5def5"
  description: "Reference Architecture (C1–C7)"
- name: "area:part-III"
  color: "c5def5"
  description: "Method (development cycle)"
- name: "area:part-IV"
  color: "c5def5"
  description: "Deployment models"
- name: "area:part-V"
  color: "c5def5"
  description: "Threat model"
- name: "area:part-VI"
  color: "c5def5"
  description: "Conformance and maturity"
- name: "area:part-VII"
  color: "c5def5"
  description: "Governance of the (future) standard"
- name: "area:appendix"
  color: "c5def5"
  description: "Appendices A–S"
- name: "area:schemas"
  color: "bfdadc"
  description: "JSON schemas (gar/gga/cc/event)"
- name: "area:harness"
  color: "bfdadc"
  description: "Reference harness"
- name: "area:governance"
  color: "bfdadc"
  description: "Project governance and process"
- name: "area:website-docs"
  color: "bfdadc"
  description: "Docs site, README, navigation"

# ── change-level: impact (mirrors Part VII §31.3) ──────────
- name: "change-level:editorial"
  color: "ededed"
  description: "Typos, formatting; no meaning change"
- name: "change-level:clarification"
  color: "c2e0c6"
  description: "Clearer wording; no requirement change"
- name: "change-level:normative-correction"
  color: "fef2c0"
  description: "Fixes a defect in a requirement"
- name: "change-level:normative-change"
  color: "f9d0c4"
  description: "Alters a requirement, schema, or conformance criterion"
- name: "change-level:extension"
  color: "d4c5f9"
  description: "Adds a profile, appendix, or mapping"

# ── status: workflow ───────────────────────────────────────
- name: "status:triage"
  color: "ededed"
  description: "Awaiting maintainer triage"
- name: "status:accepted"
  color: "0e8a16"
  description: "Confirmed; will be acted on"
- name: "status:needs-rfc"
  color: "d93f0b"
  description: "Requires an RFC before resolution"
- name: "status:in-review"
  color: "fbca04"
  description: "Under active review / FCP"
- name: "status:blocked"
  color: "000000"
  description: "Blocked on another item"
- name: "status:wontfix"
  color: "ffffff"
  description: "Out of scope or declined (with rationale)"

# ── community: invitations ─────────────────────────────────
- name: "good-first-challenge"
  color: "7057ff"
  description: "A good entry point for a first contribution"
- name: "help-wanted"
  color: "008672"
  description: "Maintainers would welcome help here"
- name: "pilot-feedback"
  color: "1d76db"
  description: "Raised by a pilot implementer"
- name: "reviewer-application"
  color: "1d76db"
  description: "Submitted via the reviewer-application discussion template"
