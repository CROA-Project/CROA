name: Review tier

# Enforces the two review tiers of .github/REVIEW_AND_MERGE.md §2.
#
# GitHub has a single required-approvals count per ruleset, applied to every
# file in the branch: it cannot ask for one approval normally and two on the
# specification, and it cannot require that an approval come from an owner of
# the paths the pull request touches. This workflow does both.
#
# Register it as a REQUIRED status check, otherwise it reports and enforces
# nothing — which would be the consultative enforcement this project exists to
# argue against.
#
# It runs on review events as well as code events, so that the check turns green
# the moment a qualifying approval lands, without a new push.
#
# ── What changed on 7 September 2026, and why ────────────────────────────────
# The previous version required a fixed TWO approvals and excluded the author.
# With two maintainers that is one possible approver against two required: every
# elevated pull request was structurally unmergeable, which is recorded as D-03
# and which cost four bypasses recorded as D-04. A required check that must be
# bypassed to ship anything is not enforcement; it is a ritual with an override,
# and the override is where the policy actually lives.
#
# The rule is now the one D-03 promised: **two approvals, or every eligible
# owner when there are fewer than two of them.** It is weaker in the count and
# stronger in attribution — approvals are now counted only from declared owners
# of the paths actually touched, which GitHub cannot express natively and which
# GOVERNANCE-DEVIATIONS.md lists as an open structural gap.
#
# A two-person project cannot have four-eyes review. Saying so in the rule is
# better than a rule that pretends otherwise and is bypassed every time.

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  review-tier:
    name: Review tier
    runs-on: ubuntu-latest
    steps:
      - name: Check approvals against the tier and the owners of the changed paths
        uses: actions/github-script@v7
        with:
          script: |
            // ── Elevated surfaces. Keep in step with .github/CODEOWNERS and
            // .github/REVIEW_AND_MERGE.md §2. Prefix match, or exact file.
            const ELEVATED = [
              'spec/',          // normative text, schemas, conformance
              'rfcs/',          // the process by which change happens
              '.github/',       // the guardrails themselves
              'GOVERNANCE.md',
              'CODE_OF_CONDUCT.md',
              'SECURITY.md',
              'CITATION.cff',
              'CORE-TEAM.md',
              'MAINTAINERS.md',
              'LICENSE',
              'LICENSE-CODE',
              'LICENSE-DOCS',
            ];
            // ── The threshold, and it is deliberately weaker than D-03 promised.
            //
            // D-03 said the corrected rule would be "two approvals, or every eligible
            // reviewer when the project has fewer than three maintainers". With two
            // owners and the author excluded, "every eligible reviewer" is still both
            // of them -- so that rule leaves one absent person able to block every
            // elevated change indefinitely, which is what happened on 7 September and
            // is recorded as D-05 and D-06.
            //
            // So: two approvals once three owners are eligible; one until then. That
            // is two eyes on the change (author plus one owner) rather than three, and
            // it is a real loosening, not a clarification. It is written here rather
            // than buried because a reader of this file is entitled to know that an
            // elevated pull request in this project currently needs ONE approval.
            //
            // It tightens on its own: a fourth core-team member restores the two-
            // approval rule with no edit to this file and no decision to remember.
            const FULL_QUORUM = 2;        // approvals required when the team is big enough
            const QUORUM_FROM = 3;        // eligible owners needed before FULL_QUORUM applies

            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number: pr.number, per_page: 100,
            });

            const touched = files.map(f => f.filename);
            const elevated = touched.filter(p =>
              ELEVATED.some(e => e.endsWith('/') ? p.startsWith(e) : p === e)
            );

            if (elevated.length === 0) {
              core.info('No elevated surface touched. Standard tier: one approval, enforced by the ruleset.');
              core.summary
                .addHeading('Review tier: standard', 3)
                .addRaw('This pull request touches no elevated surface. One approval is required, and the branch ruleset enforces it.')
                .write();
              return;
            }

            // ── CODEOWNERS is read from the BASE commit, never from the pull
            // request's own head. A pull request that adds its author to
            // CODEOWNERS must not thereby become self-approvable: the rule that
            // decides who may approve a change cannot be supplied by the change.
            let codeowners = '';
            try {
              const res = await github.rest.repos.getContent({
                owner, repo, path: '.github/CODEOWNERS', ref: pr.base.sha,
              });
              codeowners = Buffer.from(res.data.content, 'base64').toString('utf8');
            } catch (e) {
              core.setFailed(
                'Could not read .github/CODEOWNERS at the base commit, so the owners of the ' +
                'touched paths cannot be established. Fail-deny: this is the same rule the ' +
                'specification applies to C3 (Part I §2.6) — a check that cannot be performed ' +
                'is a check that failed.'
              );
              return;
            }

            // ── A deliberately small subset of CODEOWNERS matching: a leading
            // "/" anchors at the repository root, a trailing "/" matches a
            // directory prefix, "*" matches everything, and the LAST matching
            // rule wins, as GitHub does it. Anything outside that subset (a
            // "**" glob, a "!" negation, a bare "*.ext" pattern) is refused
            // below rather than silently mis-parsed: a rule about who may
            // approve is not a place to guess.
            const rules = [];
            let unsupported = null;
            for (const raw of codeowners.split('\n')) {
              const line = raw.replace(/#.*$/, '').trim();
              if (!line) continue;
              const parts = line.split(/\s+/);
              const pattern = parts[0];
              const owners = parts.slice(1);
              if (!owners.length) continue;
              if (pattern !== '*' && /[*?\[\]!]/.test(pattern)) { unsupported = pattern; break; }
              rules.push({ pattern, owners });
            }
            if (unsupported) {
              core.setFailed(
                `.github/CODEOWNERS uses the pattern "${unsupported}", which this workflow does ` +
                'not parse. Rather than guess at who owns the touched paths, it fails. Either ' +
                'simplify the pattern or extend this parser — deliberately, in a pull request ' +
                'that says which.'
              );
              return;
            }

            const matches = (pattern, path) => {
              if (pattern === '*') return true;
              const p = pattern.startsWith('/') ? pattern.slice(1) : pattern;
              if (p.endsWith('/')) return path.startsWith(p);
              return path === p || path.startsWith(p + '/');
            };

            const ownersOf = (path) => {
              let found = [];
              for (const r of rules) if (matches(r.pattern, path)) found = r.owners;  // last wins
              return found;
            };

            // ── Owners of the elevated paths actually touched.
            const ownerSet = new Set();
            for (const p of elevated) for (const o of ownersOf(p)) ownerSet.add(o);

            const teams = [...ownerSet].filter(o => o.includes('/'));
            if (teams.length) {
              core.setFailed(
                `CODEOWNERS routes these paths to team handles (${teams.join(', ')}), whose ` +
                'membership this workflow cannot read with the permissions it is granted. It ' +
                'refuses rather than counting an unknown number of eligible reviewers as zero ' +
                'or as two. Name individuals, or grant the workflow the scope to resolve teams.'
              );
              return;
            }

            const author = '@' + pr.user.login;
            const eligible = [...ownerSet].filter(o => o.toLowerCase() !== author.toLowerCase());
            const eligibleLogins = eligible.map(o => o.replace(/^@/, '').toLowerCase());

            // Never zero: a change whose only owner is its own author cannot be
            // reviewed, and "cannot be reviewed" must not resolve to "may merge".
            const required = eligible.length >= QUORUM_FROM ? FULL_QUORUM : 1;

            const list = a => a.length ? a.map(x => `\`${x}\``).join(', ') : '_none_';

            if (eligible.length === 0) {
              core.summary
                .addHeading('Review tier: elevated — no eligible reviewer', 3)
                .addRaw(`The only owner of the touched paths is the author (${author}). This change ` +
                        'cannot be reviewed by anyone, so it must not merge on the strength of a ' +
                        'count of zero.')
                .addList(elevated.slice(0, 20))
                .write();
              core.setFailed(
                `Elevated tier: the author is the sole owner of the touched paths, so there is no ` +
                `eligible reviewer. This is a gap in CODEOWNERS or in the team, not a pull request ` +
                `that has passed review. See .github/REVIEW_AND_MERGE.md §2.`
              );
              return;
            }

            // ── Latest review state per reviewer. A later "changes requested"
            // or dismissal overrides an earlier approval.
            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner, repo, pull_number: pr.number, per_page: 100,
            });

            const latest = new Map();
            for (const r of reviews) {
              if (!r.user) continue;
              if (r.state === 'COMMENTED') continue;   // a comment is not a verdict
              latest.set(r.user.login, r.state);
            }

            // Approvals count only from declared owners of the touched paths.
            // GitHub cannot express this natively; it is the fourth structural
            // gap listed in GOVERNANCE-DEVIATIONS.md.
            const approvers = [...latest.entries()]
              .filter(([login, state]) => state === 'APPROVED'
                                       && login.toLowerCase() !== pr.user.login.toLowerCase()
                                       && eligibleLogins.includes(login.toLowerCase()))
              .map(([login]) => login);

            const nonOwnerApprovers = [...latest.entries()]
              .filter(([login, state]) => state === 'APPROVED'
                                       && !eligibleLogins.includes(login.toLowerCase())
                                       && login.toLowerCase() !== pr.user.login.toLowerCase())
              .map(([login]) => login);

            const blocking = [...latest.entries()]
              .filter(([, state]) => state === 'CHANGES_REQUESTED')
              .map(([login]) => login);

            core.summary
              .addHeading('Review tier: elevated', 3)
              .addRaw(`This pull request touches ${elevated.length} elevated path(s). Owners of those ` +
                      `paths, excluding the author: ${list(eligible)}. **${required} approval(s) ` +
                      `required** — one while fewer than ${QUORUM_FROM} owners are eligible, ` +
                      `${FULL_QUORUM} above that. See GOVERNANCE-DEVIATIONS.md D-06.`)
              .addList(elevated.slice(0, 20))
              .addRaw(`Qualifying approvals: **${approvers.length} of ${required}** ${list(approvers.map(a => '@' + a))}`)
              .write();

            if (nonOwnerApprovers.length) {
              core.warning(
                `Approved by ${nonOwnerApprovers.join(', ')}, who do not own the touched paths. ` +
                'Not counted. This is deliberate: an approval means an owner looked, not that ' +
                'someone did.'
              );
            }

            if (blocking.length > 0) {
              core.setFailed(`Changes requested by ${list(blocking)}. Resolve before merging.`);
              return;
            }

            if (approvers.length < required) {
              core.setFailed(
                `Elevated tier: ${required} approval(s) required from an owner of the touched ` +
                `paths, ${approvers.length} present. Eligible: ${eligible.join(', ') || 'none'}. ` +
                `Touched: ${elevated.slice(0, 5).join(', ')}${elevated.length > 5 ? ', …' : ''}. ` +
                `See .github/REVIEW_AND_MERGE.md §2.`
              );
              return;
            }

            core.info(`Elevated tier satisfied: ${approvers.length}/${required} owner approvals (${approvers.join(', ')}).`);
