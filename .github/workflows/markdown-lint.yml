name: Markdown lint
on:
  pull_request:
    paths: ["**/*.md"]
  push:
    branches: [main]
    paths: ["**/*.md"]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: |
            **/*.md
        # spec/ used to be excluded on the grounds that it mirrored the published
        # specification. It does not: it carries the errata, the normative
        # properties, the identifier scheme and the harness defect register, all
        # of which are written here and maintained here. It is linted like the rest.
