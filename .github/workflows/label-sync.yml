name: Sync labels
on:
  push:
    branches: [main]
    paths: [".github/labels.yml"]
  workflow_dispatch: {}
permissions:
  issues: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply label taxonomy
        uses: micnncim/action-label-syncer@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          manifest: .github/labels.yml
          prune: false   # set true once the taxonomy is stable to remove stray labels
